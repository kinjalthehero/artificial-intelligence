services:
  - type: web
    name: genai-doc-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
    plan: free
    healthCheckPath: /api/health-check
